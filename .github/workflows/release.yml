name: Release Foldary (Windows NSIS Installer)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode: build & publish Windows NSIS .exe installer, or bump version only with no installer output"
        required: true
        type: choice
        default: release_installer
        options:
          - release_installer
          - version_bump_only
      bump_type:
        description: "How to increment the version (use 'none' to release the current version without bumping)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - custom
          - none
      custom_version:
        description: "Exact SemVer (e.g. 2.0.0) — used only when bump_type is 'custom'"
        required: false
        type: string
        default: ""
      draft_release:
        description: "Publish GitHub Release as draft (applies only to release_installer)"
        required: false
        type: boolean
        default: false
      release_notes:
        description: "Optional extra release notes (applies only to release_installer)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: foldary-manual-release
  cancel-in-progress: false

# Order: checks -> build -> push. The version bump is applied locally in each job from the same
# starting commit and is only pushed (with the tag and release) after the installer has built,
# so a failed build leaves the branch untouched and the run can be retried without skipping a
# version.
jobs:
  prepare_version:
    name: Checks, Version & Pre-Flight Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous_version: ${{ steps.bump.outputs.previous_version }}
      changed: ${{ steps.bump.outputs.changed }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record starting commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Compute and sync version across manifests
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: node scripts/bump-version.mjs --type "$BUMP_TYPE" --custom "$CUSTOM_VERSION" --github-output

      - name: Pre-flight tag and branch checks
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
          VERSION_CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          if [ "$RELEASE_MODE" = "release_installer" ]; then
            TAG="v${NEXT_VERSION}"
            if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists. Choose a higher version bump or delete the existing tag before releasing." >&2
              exit 1
            fi
          fi
          if [ "$VERSION_CHANGED" = "true" ] && [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Version bumps must be triggered from a branch (current ref type: ${GITHUB_REF_TYPE})." >&2
            exit 1
          fi

      # Version-only mode has no build to wait for, so it pushes here, after the checks above
      - name: Commit and push version bump (version_bump_only)
        if: inputs.mode == 'version_bump_only' && steps.bump.outputs.changed == 'true'
        env:
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          if [ -f src-tauri/Cargo.lock ]; then
            git add src-tauri/Cargo.lock
          fi
          git commit -m "chore(version): bump to v${NEXT_VERSION} (no installer output)"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Write job summary for version-only bump
        if: inputs.mode == 'version_bump_only'
        env:
          PREV_VERSION: ${{ steps.bump.outputs.previous_version }}
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "### No-Output Version Increase Completed"
            echo ""
            echo "- **Version**: \`${PREV_VERSION}\` → \`${NEXT_VERSION}\`"
            echo "- **Mode**: \`version_bump_only\` (no NSIS installer built, no tag or GitHub Release created)"
          } >> "$GITHUB_STEP_SUMMARY"

  build_windows:
    name: Build Windows NSIS Installer (.exe)
    needs: prepare_version
    if: inputs.mode == 'release_installer'
    runs-on: windows-latest
    outputs:
      exe_name: ${{ steps.assets.outputs.exe_name }}
      sha256: ${{ steps.assets.outputs.sha256 }}
    steps:
      - name: Checkout starting commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_version.outputs.base_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply version bump locally (not pushed)
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          EXPECTED_VERSION: ${{ needs.prepare_version.outputs.version }}
        run: |
          node scripts/bump-version.mjs --type "$BUMP_TYPE" --custom "$CUSTOM_VERSION"
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$ACTUAL" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch: expected ${EXPECTED_VERSION}, got ${ACTUAL}." >&2
            exit 1
          fi

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo.lock exists for Rust cache
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/Cargo.lock")) {
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          }

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate compliant multi-resolution Windows & Tauri icons
        run: npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png

      - name: Build Windows NSIS installer (.exe) via Tauri v2
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Collect installer and generate SHA-256 checksum
        id: assets
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "NSIS installer executable (*-setup.exe) was not found in $nsisDir"
          }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $checksumPath = Join-Path $nsisDir "SHA256SUMS.txt"
          "$hash  $($exe.Name)" | Out-File -FilePath $checksumPath -Encoding utf8 -NoNewline

          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            ${{ steps.assets.outputs.exe_path }}
            ${{ steps.assets.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push Version Bump, Tag & Publish Release
    needs: [prepare_version, build_windows]
    if: inputs.mode == 'release_installer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout starting commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_version.outputs.base_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The push only fast-forwards: if the branch moved during the build it is rejected and
      # the release stops before a tag exists.
      - name: Commit and push version bump
        id: commit
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          NEXT_VERSION: ${{ needs.prepare_version.outputs.version }}
        run: |
          node scripts/bump-version.mjs --type "$BUMP_TYPE" --custom "$CUSTOM_VERSION"
          if [ "$(node -p "require('./package.json').version")" != "$NEXT_VERSION" ]; then
            echo "Version mismatch: expected ${NEXT_VERSION}." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${NEXT_VERSION}" >/dev/null; then
            echo "Tag v${NEXT_VERSION} was created while the installer was building." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
            if [ -f src-tauri/Cargo.lock ]; then
              git add src-tauri/Cargo.lock
            fi
            git commit -m "chore(release): prepare v${NEXT_VERSION}"
            git push origin HEAD:"refs/heads/${GITHUB_REF_NAME}"
          else
            echo "Version files unchanged (current version: ${NEXT_VERSION})."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Publish GitHub Release & create tag atomically
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          TAG_NAME: v${{ needs.prepare_version.outputs.version }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
          EXTRA_NOTES: ${{ inputs.release_notes }}
          EXE_NAME: ${{ needs.build_windows.outputs.exe_name }}
          SHA256: ${{ needs.build_windows.outputs.sha256 }}
        run: |
          NOTES="## Foldary ${TAG_NAME}

          ### Windows Installer (NSIS)
          - Download \`${EXE_NAME}\` and run it to install Foldary.
          - SHA-256: \`${SHA256}\`"
          if [ -n "$(echo "$EXTRA_NOTES" | tr -d '[:space:]')" ]; then
            NOTES="${NOTES}

          ### Release Notes
          ${EXTRA_NOTES}"
          fi

          ARGS=(release create "$TAG_NAME" release-assets/*
            --target "$COMMIT_SHA"
            --title "Foldary ${TAG_NAME}"
            --notes "$NOTES"
            --generate-notes)
          if [ "$DRAFT_RELEASE" = "true" ]; then
            ARGS+=(--draft)
          fi
          gh "${ARGS[@]}"

      - name: Write job summary
        env:
          VERSION: ${{ needs.prepare_version.outputs.version }}
          EXE_NAME: ${{ needs.build_windows.outputs.exe_name }}
          SHA256: ${{ needs.build_windows.outputs.sha256 }}
        run: |
          {
            echo "### Foldary v${VERSION} Released"
            echo ""
            echo "- **Installer**: \`${EXE_NAME}\` (Windows NSIS)"
            echo "- **SHA-256**: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
