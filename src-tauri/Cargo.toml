[package]
name = "foldary"
version = "2.0.1"
description = "Foldary — Folder-first desktop file launcher and sorter"
authors = ["Foldary Contributors"]
edition = "2021"

[lib]
name = "foldary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
